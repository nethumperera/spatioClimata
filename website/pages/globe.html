<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Globe | spatioClimata</title>
    <meta
      name="description"
      content="Interactive globe featuring live ERA5 climate data (precipitation, temperature, humidity, wind) and GloFAS hydrological forecasts (river discharge, soil wetness, runoff) from Copernicus, updated daily at 20:00 IST."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="icon" type="image/png" href="../assets/images/logo.png" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/globe.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  </head>
  <body data-globe-page data-theme="dark">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../index.html">
          <span class="brand-mark"></span>
          <span>spatioClimata</span>
        </a>
        <nav class="nav">
          <a href="../index.html"><i class="bi bi-house"></i>Home</a>
          <a class="active" href="globe.html"><i class="bi bi-globe2"></i>Live Globe</a>
          <a href="docs.html"><i class="bi bi-journal-text"></i>Docs</a>
          <a href="registry.html"><i class="bi bi-database"></i>Registry</a>
          <a href="examples.html"><i class="bi bi-flask"></i>Examples</a>
          <a href="https://github.com/nethumperera/spatioClimata" target="_blank" rel="noreferrer"><i class="bi bi-github"></i>GitHub</a>
        </nav>
      </div>
    </header>

    <div id="globe-container">
      <div id="map" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1;"></div>

      <!-- Control Panel -->
      <div id="globe-controls" class="glass-panel" style="z-index: 1000;">
        <h3><i class="bi bi-broadcast"></i> Live Climate & Hydrology Data</h3>
        <p style="font-size: 0.85rem; opacity: 0.8; margin: -0.5rem 0 1rem 0;">ERA5 + GloFAS • Updated daily 20:00 IST</p>

        <div class="control-group">
          <label for="variable-select">Variable</label>
          <select id="variable-select">
            <option value="">Loading…</option>
          </select>
        </div>

        <div class="control-group">
          <label for="date-slider">Date</label>
          <input type="range" id="date-slider" min="0" max="0" value="0" step="1" />
          <div class="date-display">
            <span id="date-label">—</span>
            <div class="playback-row">
              <button id="play-btn" title="Play / Pause"><i class="bi bi-play-fill"></i></button>
              <span id="playback-status"></span>
            </div>
          </div>
        </div>

        <div class="control-group">
          <label for="wind-checkbox">Wind Arrows</label>
          <input type="checkbox" id="wind-checkbox" />
        </div>

        <div id="color-legend">
          <div class="legend-label-text"><span id="legend-unit"></span></div>
          <div class="gradient-bar"></div>
          <div class="legend-labels">
            <span id="legend-min">0</span>
            <span id="legend-max">100</span>
          </div>
        </div>
      </div>

      <!-- Info Badge -->
      <div id="info-badge" class="glass-panel" style="z-index: 1000;">
        <span class="live-dot"></span>
        <span id="info-text">Initializing…</span>
      </div>

      <!-- Loading Overlay -->
      <div id="loading-overlay" style="z-index: 2000;">
        <div class="spinner"></div>
        <p>Loading climate data…</p>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="../assets/js/globe.js"></script>
  </body>
</html>
