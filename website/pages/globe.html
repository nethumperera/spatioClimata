<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Globe | spatioClimata</title>
    <meta
      name="description"
      content="Interactive 2D map showing live GloFAS hydrological data from Copernicus, powered by spatioClimata."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"
    />
    <link rel="icon" type="image/png" href="../assets/images/logo.png" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/globe.css" />
  </head>
  <body data-globe-page>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="../index.html">
          <span class="brand-mark"></span>
          <span>spatioClimata</span>
        </a>
        <nav class="nav">
          <a href="../index.html"><i class="bi bi-house"></i>Home</a>
          <a class="active" href="globe.html"><i class="bi bi-globe2"></i>Live Globe</a>
          <a href="docs.html"><i class="bi bi-journal-text"></i>Docs</a>
          <a href="registry.html"><i class="bi bi-database"></i>Registry</a>
          <a href="examples.html"><i class="bi bi-flask"></i>Examples</a>
          <a href="https://github.com/nethumperera/spatioClimata" target="_blank" rel="noreferrer"><i class="bi bi-github"></i>GitHub</a>
        </nav>
      </div>
    </header>

    <div id="map-container" style="display: flex; height: calc(100vh - 60px);">
      <!-- Map Canvas -->
      <div id="map" style="flex: 1; position: relative;"></div>

      <!-- Control Panel -->
      <div id="map-controls" class="glass-panel" style="position: absolute; top: 20px; right: 20px; width: 300px; max-height: 90vh; overflow-y: auto; z-index: 1000;">
        <h3><i class="bi bi-broadcast"></i> GloFAS Data</h3>

        <div class="control-group">
          <label for="variable-select">Variable</label>
          <select id="variable-select">
            <option value="">Loading…</option>
          </select>
        </div>

        <div class="control-group">
          <label for="date-slider">Timeline</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="play-btn" class="btn btn-sm" title="Play / Pause"><i class="bi bi-play-fill"></i></button>
            <input type="range" id="date-slider" min="0" max="0" value="0" step="1" style="flex: 1;" />
          </div>
          <div id="date-display" style="text-align: center; margin-top: 8px; font-size: 0.9em;">
            <strong id="date-label">—</strong>
          </div>
        </div>

        <div id="color-legend" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
          <div style="font-size: 0.85em; margin-bottom: 8px;">
            <strong id="var-label">Variable</strong><br/>
            <small id="var-unit"></small>
          </div>
          <div style="background: linear-gradient(to right, #440154, #31688e, #35b779, #fde724); height: 20px; border-radius: 3px; margin-bottom: 8px;"></div>
          <div style="display: flex; justify-content: space-between; font-size: 0.8em;">
            <span id="legend-min">0</span>
            <span id="legend-max">100</span>
          </div>
        </div>

        <div id="info-panel" style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.85em;">
          <p><span class="live-dot" style="display: inline-block; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; margin-right: 8px;"></span><span id="info-text">Ready</span></p>
        </div>
      </div>

      <!-- Loading Overlay -->
      <div id="loading-overlay" style="display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000;">
        <div style="text-align: center;">
          <div class="spinner" style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <p style="color: white;">Loading climate data…</p>
        </div>
      </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/map.js"></script>
  </body>
</html>
