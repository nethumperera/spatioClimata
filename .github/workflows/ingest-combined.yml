name: streaming-ingest-combined

on:
  schedule:
    # Daily at 20:00 IST -> 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      full_window:
        description: "Fetch the full retention window (bootstrap)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ingest-both:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r streaming/requirements.txt

      - name: Diagnostics: env and packages
        run: |
          echo "BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-<not set>}"
          echo "SPATIOCLIMATA_API_KEY set: ${SPATIOCLIMATA_API_KEY:+yes}"
          python -m pip show vercel-blob || true
          python -m pip list --format=columns | grep vercel-blob || true

      - name: Run GloFas ingest (default config)
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.full_window }}" = "true" ]; then
            EXTRA_FLAGS="--full-window"
          fi
          python streaming/ingest.py $EXTRA_FLAGS
        env:
          SPATIOCLIMATA_API_KEY: ${{ secrets.SPATIOCLIMATA_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Run ERA5 ingest
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.full_window }}" = "true" ]; then
            EXTRA_FLAGS="--full-window"
          fi
          python streaming/ingest.py --config streaming/config_era5.json $EXTRA_FLAGS
        env:
          SPATIOCLIMATA_API_KEY: ${{ secrets.SPATIOCLIMATA_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
