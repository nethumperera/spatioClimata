name: streaming-ingest

on:
  schedule:
    # Daily at 06:00 UTC — matrix fans out one job per variable
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      variable:
        description: "Single variable to ingest (leave blank for all)"
        required: false
        default: ""
      full_window:
        description: "Fetch the full retention window (bootstrap)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialise to respect Copernicus CDS rate limits
      max-parallel: 1
      matrix:
        variable:
          - river_discharge_in_the_last_24_hours
          - soil_wetness_index_root_zone
          - runoff_water_equivalent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r streaming/requirements.txt

      - name: Should this variable run?
        id: gate
        run: |
          INPUT_VAR="${{ github.event.inputs.variable }}"
          MATRIX_VAR="${{ matrix.variable }}"
          if [ -z "$INPUT_VAR" ] || [ "$INPUT_VAR" = "$MATRIX_VAR" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run incremental ingest
        if: steps.gate.outputs.skip != 'true'
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.full_window }}" = "true" ]; then
            EXTRA_FLAGS="--full-window"
          fi
          python streaming/ingest.py --variable "${{ matrix.variable }}" $EXTRA_FLAGS
        env:
          SPATIOCLIMATA_API_KEY: ${{ secrets.SPATIOCLIMATA_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
