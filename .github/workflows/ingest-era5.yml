name: streaming-ingest-era5

on:
  schedule:
    # Daily at 20:00 IST -> 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      full_window:
        description: "Fetch the full retention window (bootstrap)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r streaming/requirements.txt

      - name: Run ERA5 ingest
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.full_window }}" = "true" ]; then
            EXTRA_FLAGS="--full-window"
          fi
          python streaming/ingest.py --config streaming/config_era5.json $EXTRA_FLAGS
        env:
          SPATIOCLIMATA_API_KEY: ${{ secrets.SPATIOCLIMATA_API_KEY }}

      - name: Commit updated website data
        run: |
          if [ -z "$(git status --porcelain -- website/data)" ]; then
            echo "No website data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/data
          git commit -m "chore(data): update ERA5 live window"
          git push origin HEAD:main
