[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatioClimata"
version = "0.1.0"
description = "Copernicus climate and hydrology data pipeline toolkit with analytics-ready outputs."
readme = "README.md"
authors = [
  { name = "Nethum Perera", email = "nethumsemithaperera@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["copernicus", "era5", "glofas", "climate", "hydrology", "geospatial", "xarray", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
  "cdsapi>=0.7.3",
  "xarray>=2024.1.0",
  "numpy>=1.25.0",
  "netcdf4>=1.6.0",
  "h5netcdf>=1.3.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dask = [
  "dask[distributed]>=2024.4.1",
  "fsspec>=2024.3.1",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/nethumperera/spatioClimata"
Repository = "https://github.com/nethumperera/spatioClimata"
Issues = "https://github.com/nethumperera/spatioClimata/issues"

[project.scripts]
spatioclimata = "spatioclimata.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
